plugins {
    id ("application")
    id ("java")
    id ("org.openjfx.javafxplugin") version "0.1.0"
    id ("checkstyle")
    id ("com.github.spotbugs") version "6.2.2"
    id ("pmd")
    id ("jacoco")
    id ("org.beryx.runtime") version "1.13.1"
}

application {
    mainClass = "Launcher"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(24)
    }
}

javafx {
    version = "24.0.2"
    modules = [ "javafx.controls" , "javafx.fxml"]
}

checkstyle {
    toolVersion = "10.26.1"
}

tasks.named('checkstyleTest') {
    enabled = false
}

spotbugs {
    ignoreFailures = true
    showStackTraces = true
    showProgress = true
    spotbugsTest.enabled = false
}

spotbugsMain {
    reports {
        html {
            required = true
            stylesheet = "fancy-hist.xsl"
        }
    }
}

pmd {
    toolVersion = "7.8.0"
    ignoreFailures = true
    consoleOutput = true
    ruleSets = ["category/java/errorprone.xml", "category/java/bestpractices.xml"]
    pmdTest.enabled = false
}

test {
    ignoreFailures = true
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: "**Driver**")
        }))
    }
}

// Builds a copy of the game with its own Java built in, so players do not need Java installed.
// Run "gradlew packageGame" and share the zip in build/distributions.
runtime {
    options = ["--strip-debug", "--compress", "zip-6", "--no-header-files", "--no-man-pages"]
    modules = ["java.base", "java.desktop", "jdk.unsupported", "jdk.jsobject", "java.xml"]
    jpackage {
        imageName = "Paradax"
        skipInstaller = true
    }
}

tasks.register("packageGame", Zip) {
    group = "distribution"
    description = "Zips the self-contained game so it can be uploaded and downloaded."
    dependsOn tasks.named("jpackageImage")
    def os = System.getProperty("os.name").toLowerCase()
    def platform = os.contains("win") ? "windows" : os.contains("mac") ? "mac" : "linux"
    archiveFileName = "Paradax-${platform}.zip"
    destinationDirectory = layout.buildDirectory.dir("distributions")
    from(layout.buildDirectory.dir("jpackage"))
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform("org.junit:junit-bom:5.10.0")
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}